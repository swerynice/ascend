<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASCEND">
<meta name="theme-color" content="#04060c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ASCEND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: eine schmale Spalte aus leuchtenden "System-Fenstern", feste Tab-Leiste unten. Bewusst nur dunkles Design. */
:root{
  --bg:#04060c; --panel:rgba(9,20,40,.82); --panel2:rgba(77,163,255,.07);
  --line:rgba(77,163,255,.55); --line2:rgba(77,163,255,.22);
  --glow:#4da3ff; --glow2:#a9d4ff; --fg:#dce9ff; --mute:#7f93b6;
  --gold:#ffc94d; --red:#ff4d6a; --green:#3ee08f; --ink:#021022;
  --disp:'Chakra Petch',ui-monospace,'SF Mono',Menlo,monospace;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 60% at 50% -10%,rgba(77,163,255,.22),transparent 60%),
  linear-gradient(rgba(77,163,255,.05) 1px,transparent 1px) 0 0/100% 28px;}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance}
.win{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px;
  box-shadow:0 0 18px rgba(77,163,255,.16),inset 0 0 28px rgba(77,163,255,.06);}
.win::before,.win::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--glow);pointer-events:none}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win>h2{margin:-14px -14px 12px;padding:9px 14px;font:600 12px/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--glow2);
  border-bottom:1px solid var(--line2);background:linear-gradient(90deg,rgba(77,163,255,.2),transparent 70%);display:flex;justify-content:space-between;gap:8px}
.win>h2 small{letter-spacing:.08em;color:var(--mute);font-weight:500}
.win.red{--line:rgba(255,77,106,.6);--glow:var(--red);--glow2:#ffb3c0;box-shadow:0 0 22px rgba(255,77,106,.25),inset 0 0 28px rgba(255,77,106,.08)}
.win.red>h2{background:linear-gradient(90deg,rgba(255,77,106,.25),transparent 70%)}
.win.gold{--line:rgba(255,201,77,.6);--glow:var(--gold);--glow2:#ffe3a3}
.win.gold>h2{background:linear-gradient(90deg,rgba(255,201,77,.2),transparent 70%)}
.mute{color:var(--mute)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{font:600 13px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;background:rgba(77,163,255,.1);color:var(--glow2);
  border:1px solid var(--line);padding:12px 14px;border-radius:3px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--glow);color:var(--ink);border-color:var(--glow);box-shadow:0 0 14px rgba(77,163,255,.45)}
.btn.red{background:rgba(255,77,106,.14);color:#ffc2cc;border-color:rgba(255,77,106,.6)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--mute)}
.btn.sm{padding:8px 10px;font-size:11px}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--glow2);outline-offset:2px}
input,select{background:rgba(0,0,0,.4);border:1px solid rgba(77,163,255,.35);color:var(--fg);border-radius:3px;padding:10px;font:16px var(--body);width:100%;min-width:0}
input::placeholder{color:#4f6182}
label{font:600 11px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Status */
.lvl{display:flex;align-items:flex-end;gap:16px}
.lvl .big{font:700 64px/0.85 var(--disp);color:#fff;text-shadow:0 0 22px rgba(77,163,255,.8)}
.lvl .cap{font:600 11px var(--disp);letter-spacing:.24em;color:var(--mute)}
.rank{margin-left:auto;text-align:center;border:1px solid var(--line);padding:6px 12px 8px;background:var(--panel2)}
.rank b{display:block;font:700 34px/1 var(--disp);color:var(--glow2);text-shadow:0 0 14px var(--glow)}
.bar{height:8px;background:rgba(77,163,255,.12);border:1px solid var(--line2);border-radius:1px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2a6fe0,var(--glow),#c9e6ff);box-shadow:0 0 10px var(--glow)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{border:1px solid var(--line2);background:var(--panel2);padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline}
.stat span{font:600 12px var(--disp);letter-spacing:.16em;color:var(--mute)}
.stat b{font:700 22px var(--disp);color:#fff;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px var(--disp);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);padding:4px 8px;color:var(--glow2);background:var(--panel2)}
.chip.gold{color:var(--gold);border-color:rgba(255,201,77,.45)}
.chip.red{color:#ffb3c0;border-color:rgba(255,77,106,.5)}
.chip.green{color:var(--green);border-color:rgba(62,224,143,.45)}
/* Quests */
.quest{border:1px solid var(--line2);background:var(--panel2);padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:left;color:var(--fg);font:inherit;border-radius:3px}
.quest .cat{font:600 10px var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--glow)}
.quest .t{font-weight:600;font-size:16px}
.quest .xp{margin-left:auto;font:700 14px var(--disp);color:var(--gold);white-space:nowrap}
.check{width:22px;height:22px;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700}
.check.on{background:var(--green);border-color:var(--green);color:var(--ink)}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .row{justify-content:space-between}
/* Training */
.ex{border:1px solid var(--line2);background:rgba(0,0,0,.2);padding:10px;display:flex;flex-direction:column;gap:8px}
.ex h3{font-size:16px;font-weight:600}
.sets{display:grid;grid-template-columns:24px 1fr 1fr 64px 40px;gap:6px;align-items:center}
.sets .hd{font:600 10px var(--disp);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.sets input,.sets select{padding:8px 6px;text-align:center}
.setbtn{height:38px;border:1px solid var(--line);background:transparent;color:var(--glow2);border-radius:3px;font-weight:700;cursor:pointer}
.setbtn.on{background:var(--green);border-color:var(--green);color:var(--ink)}
.typesel{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.typesel .btn{padding:16px 10px;font-size:14px}
.typesel .btn.sug{background:var(--glow);color:var(--ink);border-color:var(--glow)}
/* Fortschritt */
canvas{width:100%;height:170px;display:block}
.vol{display:grid;grid-template-columns:88px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.vbar{position:relative;height:10px;background:rgba(77,163,255,.08);border:1px solid var(--line2)}
.vbar .zone{position:absolute;top:0;bottom:0;left:40%;width:40%;background:rgba(62,224,143,.13);border-left:1px dashed rgba(62,224,143,.5);border-right:1px dashed rgba(62,224,143,.5)}
.vbar i{position:absolute;left:0;top:0;bottom:0;background:var(--glow)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{aspect-ratio:1;border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;color:var(--mute);position:relative}
.cal .w{background:rgba(77,163,255,.35);color:#fff;border-color:var(--glow)}
.cal .q::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;background:var(--gold);border-radius:50%}
.cal .today{outline:1px solid var(--gold)}
.cal .hd{border:0;aspect-ratio:auto;font:600 10px var(--disp)}
.hist{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line2);padding-top:8px}
/* Wissen */
.know h3{font-size:15px;color:var(--glow2);margin-bottom:4px}
.know p{margin:0 0 6px}
.src{font-size:12px;color:var(--mute)}
/* Nav, Modal, Toast, Timer */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(4,8,16,.94);border-top:1px solid var(--line);backdrop-filter:blur(8px);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(6px,env(safe-area-inset-left,0px))}
#nav button{background:none;border:0;color:var(--mute);font:600 10px var(--disp);letter-spacing:.1em;text-transform:uppercase;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--glow2)}
#nav button.on svg{filter:drop-shadow(0 0 6px var(--glow))}
#nav .dot{position:absolute;top:3px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(2,4,10,.78);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .win{width:100%;max-width:420px;max-height:85vh;overflow:auto;animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
.sysbig{font:700 30px/1.1 var(--disp);text-align:center;color:#fff;text-shadow:0 0 18px var(--glow);letter-spacing:.06em}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:50;
  background:rgba(9,20,40,.96);border:1px solid var(--line);padding:10px 14px;font:600 13px var(--disp);letter-spacing:.06em;color:var(--glow2);box-shadow:0 0 16px rgba(77,163,255,.35);max-width:calc(100% - 32px);text-align:center}
#timer{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:30;
  max-width:536px;margin:0 auto;background:rgba(9,20,40,.97);border:1px solid var(--gold);padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 0 16px rgba(255,201,77,.3)}
#timer b{font:700 24px var(--disp);color:var(--gold);font-variant-numeric:tabular-nums;min-width:70px}
#timer.done{border-color:var(--green)} #timer.done b{color:var(--green)}
.ob-big{font:700 26px/1.15 var(--disp);color:#fff;text-shadow:0 0 16px rgba(77,163,255,.7)}
.clock{font:700 48px/1 var(--disp);text-align:center;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--glow)}
.steps{display:flex;gap:4px}.steps i{flex:1;height:3px;background:var(--line2)}.steps i.on{background:var(--glow);box-shadow:0 0 6px var(--glow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden></nav>
<div id="timer" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ============ Grundlagen ============ */
const KEY = 'ascend_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 1) => Number(n).toLocaleString('de-DE', {maximumFractionDigits: d});
const ri = x => Math.max(1, Math.round(x));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
function dkey(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function pdate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(k, n) { const d = pdate(k); d.setDate(d.getDate() + n); return dkey(d); }
function diffDays(a, b) { return Math.round((pdate(b) - pdate(a)) / 864e5); }
function weekKey(k) { const d = pdate(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dkey(d); }
function niceDate(k) { return pdate(k).toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit'}); }
const e1rm = (w, r) => r <= 0 || w <= 0 ? 0 : (r === 1 ? w : w * (1 + r / 30)); // Epley-Formel
const round25 = x => Math.round(x / 2.5) * 2.5;

function fresh() {
  return {v:1, name:'', created:null, xp:0, streak:0, bestStreak:0, lastQuestDate:null, lastProcessed:null,
    days:{}, questHistory:{}, penalty:null, workouts:[], active:null, bw:[], prs:{}, rot:0,
    titles:[], dungeons:[], weekly:{}, tests:[], peak:null, cnt:{daily:0, cardio:0, penalties:0},
    acc:null, feedQ:[], weekXP:null, updatedAt:0, lastSync:null, syncErr:null};
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { S = fresh(); }
S = Object.assign(fresh(), S);
function writeLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Speichern fehlgeschlagen'); } }
function save() { S.updatedAt = Date.now(); writeLocal(); if (S.acc) schedulePush(); }

/* ============ Cloud: Login, Sync, Feed ============ */
const SB_URL = 'https://lgcfrtogubozltbckqom.supabase.co';
const SB_KEY = 'sb_publishable_iEY_GxDnGj3A3sSsV3fDZA_c6XUukIE'; // öffentlicher Schlüssel, Schutz über Row Level Security
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, storageKey: 'ascend_auth'}}) : null;
const mailOf = u => u.toLowerCase() + '@ascend.invalid';
let pushT = null, pushing = false;
function schedulePush() { clearTimeout(pushT); pushT = setTimeout(pushNow, 2500); }
function feed(kind, text) { if (!S.acc) return; (S.feedQ = S.feedQ || []).push({kind, text, created_at: new Date().toISOString()}); }
function publicProfile() {
  const st = stats(), li = levelInfo(S.xp), wk = weekKey(dkey()), bw = curBW() || 80, p = n => S.prs[n] || 0;
  return {id: S.acc.id, username: S.acc.username, level: li.lvl, xp: S.xp, rank: rankOf(st).r,
    str: st.STR, vit: st.VIT, agi: st.AGI, dis: st.DIS, streak: S.streak, week_key: wk,
    week_xp: S.weekXP && S.weekXP.k === wk ? S.weekXP.xp : 0,
    rel_strength: Math.round((p('Bankdrücken') + p('Kniebeugen') + p('Kreuzheben')) / bw * 100) / 100,
    prs: {bench: p('Bankdrücken'), squat: p('Kniebeugen'), dead: p('Kreuzheben')},
    title: S.titles[S.titles.length - 1] || null, updated_at: new Date().toISOString()};
}
async function pushNow() {
  if (!sb || !S.acc || !navigator.onLine || pushing) return false;
  pushing = true;
  try {
    const {data: {session}} = await sb.auth.getSession();
    if (!session) { S.syncErr = 'Nicht angemeldet'; return false; }
    const q = (S.feedQ || []).slice();
    const r1 = await sb.from('saves').upsert({id: S.acc.id, data: Object.assign({}, S, {feedQ: []}), updated_at: new Date().toISOString()});
    const r2 = await sb.from('profiles').upsert(publicProfile());
    let r3 = {error: null};
    if (q.length) r3 = await sb.from('feed').insert(q.map(x => ({kind: x.kind, text: x.text, created_at: x.created_at})));
    if (r1.error || r2.error || r3.error) { S.syncErr = (r1.error || r2.error || r3.error).message; writeLocal(); return false; }
    if (q.length) S.feedQ = (S.feedQ || []).slice(q.length);
    S.lastSync = Date.now(); S.syncErr = null; writeLocal();
    return true;
  } catch (e) { S.syncErr = 'Keine Verbindung'; return false; }
  finally { pushing = false; }
}
async function pullIfNewer() {
  if (!sb || !S.acc || !navigator.onLine) return false;
  const {data, error} = await sb.from('saves').select('data, updated_at').eq('id', S.acc.id).maybeSingle();
  if (error || !data) return false;
  const cloud = data.data;
  if (cloud && (cloud.updatedAt || 0) > (S.updatedAt || 0) + 5000) { const acc = S.acc; S = Object.assign(fresh(), cloud, {acc}); writeLocal(); return true; }
  return false;
}
async function register(u, pin) {
  const {data, error} = await sb.auth.signUp({email: mailOf(u), password: pin});
  if (error) throw new Error(/registered|exists/i.test(error.message) ? 'Dieser Name ist schon vergeben' : error.message);
  if (!data.session) throw new Error('Registrierung fehlgeschlagen. Versuch es nochmal.');
  S.acc = {id: data.user.id, username: u}; if (!S.name) S.name = u;
  const r = await sb.from('profiles').upsert(publicProfile());
  if (r.error) { await sb.auth.signOut(); S.acc = null; throw new Error(/duplicate|unique/i.test(r.error.message) ? 'Dieser Name ist schon vergeben' : r.error.message); }
  feed('join', 'ist ASCEND beigetreten');
  save(); await pushNow();
}
async function login(u, pin) {
  const {data, error} = await sb.auth.signInWithPassword({email: mailOf(u), password: pin});
  if (error) throw new Error('Name oder PIN falsch');
  const id = data.user.id;
  const pr = await sb.from('profiles').select('username').eq('id', id).maybeSingle();
  const name = (pr.data && pr.data.username) || u;
  const sv = await sb.from('saves').select('data').eq('id', id).maybeSingle();
  const cloud = sv.data && sv.data.data;
  const otherAccount = S.acc && S.acc.id !== id;
  if (cloud && (!S.created || otherAccount || (cloud.updatedAt || 0) > (S.updatedAt || 0))) S = Object.assign(fresh(), cloud);
  else if (!cloud && otherAccount) S = fresh();
  S.acc = {id, username: name}; if (!S.name) S.name = name;
  save(); await pushNow();
}

/* ============ Testwerte & Werte ============ */
const DEF = {bw:80, waist:0, bench:{w:60,r:5}, squat:{w:70,r:5}, dead:{w:80,r:5}, ohp:{w:35,r:5}, push:15, pull:3, plank:60, run:1800};
const LIFT = {bench:'Bankdrücken', squat:'Kniebeugen', dead:'Kreuzheben', ohp:'Schulterdrücken'};
function T() { const t = S.tests[S.tests.length - 1] || {}; return Object.assign({}, DEF, t); }
function curBW() { return S.bw.length ? S.bw[S.bw.length - 1].kg : T().bw; }
const fitF = () => clamp(T().push / 20, 0.6, 1.6);
const diff = () => 1 + Math.min(0.5, (levelInfo(S.xp).lvl - 1) * 0.02);

function levelInfo(xp) { let lvl = 1, need = 100, rest = xp; while (rest >= need) { rest -= need; lvl++; need = 100 + 40 * (lvl - 1); } return {lvl, rest, need}; }
function stats() {
  const t = T(), bw = curBW() || 80, p = n => S.prs[n] || 0;
  const rel = (p('Bankdrücken') + p('Kniebeugen') + p('Kreuzheben')) / bw;
  const sets = S.workouts.reduce((a, w) => a + w.ex.reduce((b, e) => b + e.sets.length, 0), 0);
  return {
    STR: Math.round(rel * 8) + Math.floor(sets / 50),
    VIT: Math.round(t.plank / 10 + t.push / 3) + Math.floor(S.cnt.daily / 5),
    AGI: Math.round(t.run / 150) + Math.floor(S.cnt.cardio / 3),
    DIS: S.streak + Math.floor(S.workouts.length / 4),
  };
}
const RANKS = [['E',0],['D',60],['C',80],['B',100],['A',125],['S',155]];
function rankOf(st) { const sum = st.STR + st.VIT + st.AGI + st.DIS; let r = 'E', next = null;
  for (let i = 0; i < RANKS.length; i++) { if (sum >= RANKS[i][1]) { r = RANKS[i][0]; next = RANKS[i + 1] || null; } }
  return {r, sum, next}; }

const PENALTIES = [
  f => `3 × ${ri(T().plank*f)} s Plank`,
  f => `${ri(40*fitF()*f)} Burpees`,
  f => `3 × ${ri((45 + T().plank*0.25)*f)} s Wandsitzen`,

  f => `${ri(T().push*2.5*f)} Liegestütze gesamt`,
];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeOffers(t) {
  const ok = QUESTS.filter(q => !(S.questHistory[q.id] && diffDays(S.questHistory[q.id], t) <= 2));
  const pool = shuffle(ok.length >= 3 ? ok : QUESTS), out = [], cats = new Set();
  for (const q of pool) if (out.length < 3 && !cats.has(q.cat)) { out.push(q.id); cats.add(q.cat); }
  for (const q of pool) if (out.length < 3 && !out.includes(q.id)) out.push(q.id);
  return out;
}
function today() {
  const t = dkey();
  if (!S.days[t]) { S.days[t] = {offers: makeOffers(t), chosen: null, text: '', xp: 0, done: false}; save(); }
  return S.days[t];
}
function makePenalty(t, missed) {
  const f = missed > 1 ? 1.25 : 1, picks = shuffle(PENALTIES).slice(0, 2).map(fn => fn(f));
  return {date: t, items: picks, done: false, missed};
}
function processDays() {
  const t = dkey();
  if (!S.created) return;
  if (!S.lastProcessed) { S.lastProcessed = t; save(); return; }
  if (S.lastProcessed >= t) return;
  let missed = 0;
  for (let d = S.lastProcessed; d < t; d = addDays(d, 1)) {
    if (d <= S.created) continue;              // Am Starttag gibt es keine Strafe
    if (!(S.days[d] && S.days[d].done)) missed++;
  }
  S.lastProcessed = t;
  if (missed > 0) {
    S.streak = 0;
    if (!S.penalty || S.penalty.done) S.penalty = makePenalty(t, missed);
    feed('fail', `hat ${missed === 1 ? 'eine Daily Quest' : missed + ' Daily Quests'} verpasst und muss eine Strafquest machen`);
    save();
    queue(() => sysWin('red', 'Warnung', `<p class="sysbig">STRAFQUEST</p>
      <p>Du hast ${missed === 1 ? 'eine Daily Quest' : missed + ' Daily Quests'} verpasst. Deine Streak ist zurückgesetzt.</p>
      <p>Bis die Strafquest erledigt ist, bekommst du <b>keine XP</b>.</p>`, [['Verstanden', 'close', 'red']]));
  } else save();
}

}

/* ============ Dungeons ============ */
function makeDungeons() {
  const t = T(), out = [], keep = S.dungeons.filter(d => d.done);
  const lift = (k, name) => { const base = e1rm(t[k].w, t[k].r); if (base > 0) out.push({id:'d_'+k+'_'+Date.now(), name, kind:'lift', ex:LIFT[k], target:round25(base*1.1), unit:'kg geschätztes Max', done:false}); };
  lift('bench', 'Eiserne Brust'); lift('squat', 'Fundament'); lift('dead', 'Erdbeben'); lift('ohp', 'Himmelsstoß');
  out.push({id:'d_pull_'+Date.now(), name:'Aufstieg', kind:'test', f:'pull', target:t.pull + 3, unit:'Klimmzüge am Stück', done:false});
  out.push({id:'d_plank_'+Date.now(), name:'Unerschütterlich', kind:'test', f:'plank', target:t.plank + 30, unit:'s Plank', done:false});
  out.push({id:'d_run_'+Date.now(), name:'Sturmläufer', kind:'test', f:'run', target:t.run + 200, unit:'m in 12 min', done:false});
  if (S.peak && S.peak < curBW()) out.push({id:'d_bw', name:'Alte Form', kind:'bw', target:S.peak, unit:'kg Körpergewicht', done:false});
  S.dungeons = keep.concat(out);
}
function dungeonCur(d) {
  if (d.kind === 'lift') return S.prs[d.ex] || 0;
  if (d.kind === 'test') return T()[d.f];
  if (d.kind === 'bw') return curBW();
  return 0;
}
function checkDungeons() {
  for (const d of S.dungeons) {
    if (d.done) continue;
    const c = dungeonCur(d), ok = d.kind === 'bw' ? c <= d.target : c >= d.target;
    if (ok) {
      d.done = true; d.doneDate = dkey(); if (!S.titles.includes(d.name)) S.titles.push(d.name);
      gainXP(200, 'Dungeon: ' + d.name, true);
      feed('dungeon', `hat den Dungeon „${d.name}“ geschafft`);
      queue(() => sysWin('gold', 'Dungeon geschafft', `<p class="sysbig">${esc(d.name.toUpperCase())}</p><p style="text-align:center">Neuer Titel freigeschaltet: <b>${esc(d.name)}</b></p>`, [['Weiter', 'close']]));
    }
  }
  save();
}

const TYPES = ['Push', 'Pull', 'Legs', 'Arme'];
const TPL = {
  Push: [['Bankdrücken','Brust','c'],['Schrägbankdrücken KH','Brust','c'],['Schulterdrücken','Schultern','c'],['Seitheben','Schultern','i'],['Trizepsdrücken am Kabel','Trizeps','i'],['Dips','Trizeps','c']],

  Arme: [['SZ-Curls','Bizeps','i'],['Enges Bankdrücken','Trizeps','c'],['Schrägbank-Curls','Bizeps','i'],['Überkopf-Trizeps am Kabel','Trizeps','i'],['Hammer Curls','Bizeps','i'],['Unterarm-Curls','Unterarme','i']],
};
const MUSCLES = ['Brust','Rücken','Schultern','Bizeps','Trizeps','Quads','Beinbeuger','Gesäß','Waden'];
const BW_EX = ['Klimmzüge', 'Dips'];
const effW = (name, w) => BW_EX.includes(name) ? curBW() + w : w;
function lastSets(name) {
  for (let i = S.workouts.length - 1; i >= 0; i--) { const e = S.workouts[i].ex.find(x => x.name === name); if (e && e.sets.length) return {date:S.workouts[i].date, sets:e.sets}; }
  return null;
}
function suggestion(name, kind) {
  const [lo, hi] = kind === 'c' ? [6, 10] : [10, 15];
  const last = lastSets(name);
  if (!last) {
    const tk = Object.keys(LIFT).find(k => LIFT[k] === name);
    if (tk) { const t = T()[tk]; return {w: round25(e1rm(t.w, t.r) * 0.72), r: lo + 2, lo, hi, note:'aus deinem Test'}; }
    return {w: 0, r: lo, lo, hi, note:'erstes Mal: Gewicht wählen, das 1–3 Wdh. vor dem Versagen endet'};
  }
  const top = Math.max(...last.sets.map(s => s.w)), allTop = last.sets.filter(s => s.w === top).every(s => s.r >= hi);
  if (allTop) { const inc = kind === 'c' ? 2.5 : 1; return {w: top + inc, r: lo, lo, hi, up:true, note:`letztes Mal ${hi}+ Wdh. geschafft, also mehr Gewicht`}; }
  const best = Math.max(...last.sets.filter(s => s.w === top).map(s => s.r));
  return {w: top, r: Math.min(hi, best + 1), lo, hi, note:`letztes Mal ${fmt(top)} kg × ${best}, jetzt 1 Wdh. mehr`};
}
function newEx(name, muscle, kind) {
  const sg = suggestion(name, kind);
  return {name, muscle, kind, sets: [0,1,2].map(() => ({w: sg.w, r: sg.r, rir: 2, done: false}))};
}
function startWorkout(type) {
  S.active = {type, date: dkey(), start: Date.now(), ex: TPL[type].slice(0, 5).map(([n, m, k]) => newEx(n, m, k))};
  save(); render();
}
function finishWorkout() {
  const a = S.active; if (!a) return;
  const ex = a.ex.map(e => ({name: e.name, muscle: e.muscle, kind: e.kind, sets: e.sets.filter(s => s.done).map(s => ({w: num(s.w), r: num(s.r), rir: num(s.rir)}))})).filter(e => e.sets.length);
  if (!ex.length) { sysWin('', 'Training', '<p>Du hast noch keinen Satz abgehakt. Tippe bei jedem fertigen Satz auf ✓.</p>', [['OK', 'close']]); return; }
  const prs = [];
  for (const e of ex) {
    const best = Math.max(...e.sets.map(s => e1rm(effW(e.name, s.w), s.r)));
    if (best > (S.prs[e.name] || 0) + 0.01) { if (S.prs[e.name]) prs.push([e.name, best]); S.prs[e.name] = Math.round(best * 10) / 10; }
  }
  S.workouts.push({id: Date.now(), date: a.date, type: a.type, min: Math.round((Date.now() - a.start) / 60000), ex});
  S.rot = (TYPES.indexOf(a.type) + 1) % 4; S.active = null; stopTimer(); save();
  const nSets = ex.reduce((s, e) => s + e.sets.length, 0);
  feed('workout', `hat ${a.type} trainiert (${nSets} ${nSets === 1 ? 'Satz' : 'Sätze'})`);
  for (const [n, v] of prs) feed('pr', `neuer Rekord: ${n} ${fmt(v)} kg (geschätztes Max)`);
  gainXP(50 + nSets * 4 + prs.length * 30, `${a.type}-Training`);
  for (const [n, v] of prs) queue(() => sysWin('gold', 'Neuer Rekord', `<p class="sysbig">PR</p><p style="text-align:center"><b>${esc(n)}</b><br><span class="num">${fmt(v)} kg</span> geschätztes Maximum</p>`, [['Stark', 'close']]));
  checkDungeons(); checkWeekly(); view = 'status'; render();
}

async function submitAuth() {
  if (authBusy) return;
  const u = $('#auName').value.trim(), pin = $('#auPin').value.trim(), err = $('#auErr');
  err.textContent = '';

  if (authMode === 'new' && $('#auPin2').value.trim() !== pin) { err.textContent = 'Die beiden PINs stimmen nicht überein'; return; }
  if (!navigator.onLine) { err.textContent = 'Keine Internetverbindung. Verbinde dich und versuch es nochmal.'; return; }
  authBusy = true; $('#auBtn').disabled = true; $('#auBtn').textContent = 'Einen Moment…';
  try {
    if (authMode === 'new') await register(u, pin); else await login(u, pin);
    authBusy = false; processDays(); view = 'status'; render();
    toast(authMode === 'new' ? 'Account erstellt' : 'Angemeldet');
  } catch (e) {
    authBusy = false; err.textContent = e.message || 'Das hat nicht geklappt. Versuch es nochmal.';
    $('#auBtn').disabled = false; $('#auBtn').textContent = authMode === 'new' ? 'Account erstellen' : 'Anmelden';

  const grad = g.createLinearGradient(0, Tp, 0, H - B); grad.addColorStop(0, color + '55'); grad.addColorStop(1, color + '00');
  g.beginPath(); g.moveTo(xy[0][0], H - B); xy.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(xy[xy.length - 1][0], H - B); g.closePath(); g.fillStyle = grad; g.fill();
  g.beginPath(); xy.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.strokeStyle = color; g.lineWidth = 2; g.shadowColor = color; g.shadowBlur = 8; g.stroke(); g.shadowBlur = 0;
  const [lx, ly] = xy[xy.length - 1]; g.beginPath(); g.arc(lx, ly, 4, 0, 7); g.fillStyle = '#fff'; g.fill();
}

  pinAsk: () => sysWin('', 'PIN ändern', `<div class="stack"><label>Neue PIN (6 Ziffern)<input id="pinNew" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>
    <label>Neue PIN wiederholen<input id="pinNew2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label><div id="pinErr" class="small" style="color:#ffb3c0"></div></div>`, [['Abbrechen', 'close', 'ghost'], ['Speichern', 'pinSave']]),
  pinSave: async () => {
    const p = $('#pinNew').value.trim(), e = $('#pinErr');
    if (!/^\d{6}$/.test(p)) { e.textContent = 'Die PIN muss genau 6 Ziffern haben'; return; }
    if ($('#pinNew2').value.trim() !== p) { e.textContent = 'Die beiden PINs stimmen nicht überein'; return; }
    const {error} = await sb.auth.updateUser({password: p});
    if (error) { e.textContent = 'Das hat nicht geklappt. Bist du online?'; return; }
    closeModal(); toast('PIN geändert');
  },
  logoutAsk: () => sysWin('', 'Abmelden', '<p>Dein Fortschritt wird gesichert und dann von diesem Handy entfernt. Mit Name und PIN kannst du dich jederzeit wieder anmelden.</p>', [['Abbrechen', 'close', 'ghost'], ['Abmelden', 'logoutYes', 'red']]),
  logoutYes: async () => {
    if (!navigator.onLine) { closeModal(); toast('Zum Abmelden brauchst du Internet, sonst geht ungesicherter Fortschritt verloren'); return; }
    const ok = await pushNow();
    if (!ok) { closeModal(); toast('Sichern fehlgeschlagen, deshalb nicht abgemeldet'); return; }
    await sb.auth.signOut(); S = fresh(); writeLocal(); closeModalSilent(); authMode = 'login'; ladder = null; render();
  },
  obNext: () => { if (!obRead(false)) return; ob.i++; render(); },
  obSkip: () => { obRead(true); ob.i++; render(); },
  obBack: () => { ob.i = Math.max(0, ob.i - 1); render(); },
  obCancel: () => { ob = null; render(); },
  obFinish: () => obFinish(),
  swToggle: b => {
    if (sw.iv) { stopSW(); const s = Math.round((Date.now() - sw.start) / 1000); $('#obN').value = s; b.textContent = 'Nochmal starten'; return; }
    sw.start = Date.now(); b.textContent = 'Stopp'; sw.iv = setInterval(() => { const s = Math.floor((Date.now() - sw.start) / 1000); const c = $('#swClock'); if (c) c.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }, 200);
  },
  cdToggle: b => {
    if (sw.iv) { stopSW(); b.textContent = 'Timer neu starten'; return; }
    sw.start = Date.now(); b.textContent = 'Timer stoppen';
    sw.iv = setInterval(() => { const left = Math.max(0, 720 - Math.floor((Date.now() - sw.start) / 1000)); const c = $('#swClock'); if (c) c.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
      if (!left) { stopSW(); b.textContent = 'Zeit um! Distanz eintragen'; try { navigator.vibrate && navigator.vibrate(600); } catch (e) {} } }, 250);
  },
};
function closeModalSilent() { $('#modal').hidden = true; $('#modal').innerHTML = ''; popQ = []; popOpen = false; }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'SELECT') return;
  const [a, arg] = b.dataset.a.split('|');
  if (a === 'wDelYes') { S.workouts = S.workouts.filter(w => String(w.id) !== arg); save(); closeModal(); render(); return; }
  if (H[a]) H[a](b);
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset.f || !S.active) return;
  const s = S.active.ex[el.dataset.i].sets[el.dataset.j]; s[el.dataset.f] = el.dataset.f === 'rir' ? num(el.value) : el.value; save();
});
document.addEventListener('change', e => {
  if (e.target.id === 'exSel') { exChart = e.target.value; render(); }
  if (e.target.id === 'importIn' && e.target.files[0]) doImport(e.target.files[0]);
});
document.addEventListener('submit', e => { if (e.target.id === 'authForm') { e.preventDefault(); submitAuth(); } });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S.acc) pushNow(); return; }
  if (S.acc && S.created && !ob && !S.active) { processDays(); render(); }
});
window.addEventListener('online', () => { if (S.acc) pushNow(); });

/* ============ Start ============ */
processDays();
render();
(async () => {
  if (!S.acc || !sb) return;
  try {
    const {data: {session}} = await sb.auth.getSession();
    if (!session) { S.syncErr = 'Bitte neu anmelden'; writeLocal(); return; }
    if (!S.active && !ob && await pullIfNewer()) { processDays(); render(); toast('Fortschritt aus der Cloud geladen'); }
    pushNow();
  } catch (e) {}
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
